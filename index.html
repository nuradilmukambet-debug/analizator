<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AITMATOV AI | SCANNER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&family=Playfair+Display:italic&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffffff;
            --bg: #0a0a0a;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg);
            color: var(--accent);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Видео во весь экран */
        #video-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; 
            background: #000;
        }
        video { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            filter: grayscale(0.8) contrast(1.2) brightness(0.7);
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.8) 100%);
            pointer-events: none; /* Чтобы клики проходили сквозь оверлей на кнопку */
        }

        header { padding: 30px; letter-spacing: 4px; font-weight: 200; text-transform: uppercase; font-size: 0.8rem; text-align: center; }

        .main-ui { text-align: center; pointer-events: auto; padding: 20px; }

        /* Кнопка Анализа */
        .analyze-trigger {
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--accent); 
            color: var(--accent);
            padding: 18px 40px; font-size: 12px; letter-spacing: 3px;
            cursor: pointer; transition: all 0.4s; 
            backdrop-filter: blur(15px);
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }
        .analyze-trigger:active {
            background: var(--accent); color: var(--bg); transform: scale(0.95);
        }

        /* Текст стихов */
        #poem-display {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem; line-height: 1.5;
            max-width: 90%; margin: 0 auto 40px auto;
            opacity: 0; transform: translateY(15px); transition: all 0.8s;
            text-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #poem-display.show { opacity: 1; transform: translateY(0); }

        .chat-sidebar {
            padding: 30px; font-size: 10px; color: #666;
            text-transform: uppercase; line-height: 1.8;
            letter-spacing: 1px;
        }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 1px;
            background: rgba(255,255,255,0.3);
            animation: moveScan 3s infinite linear;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        @keyframes moveScan { 0% { top: 0; } 100% { top: 100%; } }

        /* Лоадер при загрузке модели */
        #loader {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="video-wrapper">
        <video id="webcam" autoplay muted playsinline></video>
        <div class="scan-line"></div>
    </div>

    <div id="loader">Инициализация сознания...</div>

    <div class="overlay">
        <header>Aitmatov / Digital Echo</header>

        <div class="main-ui">
            <div id="poem-display"></div>
            <button class="analyze-trigger" id="btn">АНАЛИЗИРОВАТЬ</button>
        </div>

        <div class="chat-sidebar">
            [SYSTEM]: Neural Link Active <br>
            [STATUS]: Scanning Reality <br>
            [MODE]: Read-Only Interface
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const poemBox = document.getElementById('poem-display');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('btn');
        let model;

        // Библиотека стихов в стиле Айтматова
        const library = {
            'bottle': "«И дольше века длится миг...»\nСтекло зарыто в прах, как древний крик.\nТы — пустота, забытая в степи,\nОстанься здесь, но сердце не слепи.",
            'plastic': "Лоскут бесплодный, призрак неживой,\nЛетит над выжженной кочевником травой.\nНет в нем души, лишь холод и петля,\nО чем молчишь, уставшая земля?",
            'cup': "Чаша испита. Треснул гранит.\nПамять о предках земля сохранит.\nГлина к глине, а мусор — к беде,\nСлезы кочевника в горькой воде.",
            'multiple': "Мир слишком замусорен образами.\nОставь лишь одну вещь перед моим взором,\nЧтобы я смог услышать ее голос.",
            'empty': "Степь пуста. Только ветер и вечность.\nНи тени, ни следа, ни брошенного слова."
        };

        async function init() {
            try {
                // Загружаем модель
                model = await cocoSsd.load();
                loader.style.display = 'none';

                // Запрашиваем камеру
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, // Задняя камера
                    audio: false 
                });
                
                video.srcObject = stream;
                
                // Принудительно запускаем видео
                video.onloadedmetadata = () => {
                    video.play();
                };

            } catch (err) {
                console.error(err);
                loader.innerText = "Ошибка доступа к камере";
            }
        }

        async function analyzeScene() {
            if (!model) return;

            poemBox.classList.remove('show');
            btn.innerText = "СКАНИРУЮ...";

            const predictions = await model.detect(video);
            
            setTimeout(() => {
                if (predictions.length > 3) {
                    poemBox.innerText = library.multiple;
                } else if (predictions.length > 0) {
                    const found = predictions[0].class;
                    
                    if (found === 'bottle') {
                        poemBox.innerText = library.bottle;
                    } else if (found === 'handbag' || found === 'backpack') {
                        poemBox.innerText = library.plastic;
                    } else if (found === 'cup') {
                        poemBox.innerText = library.cup;
                    } else {
                        poemBox.innerText = `Вижу ${found}...\n\nОбрывок мысли, брошенный в песок,\nЗачем ты здесь, зачем ты одинок?`;
                    }
                } else {
                    poemBox.innerText = library.empty;
                }
                
                poemBox.classList.add('show');
                btn.innerText = "АНАЛИЗИРОВАТЬ";
            }, 600);
        }

        btn.addEventListener('click', analyzeScene);

        // Запуск при загрузке
        window.addEventListener('load', init);
    </script>
</body>
</html>
