<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AITMATOV AI | MINI-SCAN</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&family=Playfair+Display:italic&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffffff; --bg: #050505; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--accent); font-family: 'Inter', sans-serif; overflow: hidden; }

        /* Контейнер для маленького квадрата камеры */
        .camera-viewport {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 40px auto 20px auto;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(255,255,255,0.05);
            background: #000;
            overflow: hidden;
            border-radius: 4px;
        }

        video { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(0.4) contrast(1.2);
        }

        /* Линия сканера внутри квадрата */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.5);
            animation: moveScan 2s infinite linear;
            z-index: 5;
        }
        @keyframes moveScan { 0% { top: 0; } 100% { top: 100%; } }

        .overlay {
            display: flex; flex-direction: column; justify-content: space-between;
            height: calc(100% - 280px);
            text-align: center;
        }

        header { padding: 20px; letter-spacing: 5px; font-weight: 200; text-transform: uppercase; font-size: 0.7rem; opacity: 0.6; }

        .analyze-trigger {
            background: none; border: 1px solid var(--accent); color: var(--accent);
            padding: 15px 30px; font-size: 10px; letter-spacing: 2px;
            cursor: pointer; border-radius: 2px; text-transform: uppercase;
            transition: 0.3s; margin-top: 20px;
        }
        .analyze-trigger:active { background: white; color: black; }

        #poem-display {
            font-family: 'Playfair Display', serif; font-size: 1.2rem; line-height: 1.5;
            max-width: 85%; margin: 30px auto; opacity: 0; transition: 1s;
            min-height: 120px;
        }
        #poem-display.show { opacity: 1; }

        .footer-info { font-size: 8px; color: #333; text-transform: uppercase; padding-bottom: 20px; }
    </style>
</head>
<body>

    <header>Aitmatov AI / Scanner</header>

    <div class="camera-viewport">
        <div class="scan-line"></div>
        <video id="webcam" autoplay muted playsinline></video>
    </div>

    <div class="overlay">
        <div id="poem-display"></div>
        
        <div class="controls">
            <button class="analyze-trigger" id="btn">Анализировать</button>
        </div>

        <div class="footer-info">
            [Link]: Stable <br> [Sensor]: Active
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const poemBox = document.getElementById('poem-display');
        const btn = document.getElementById('btn');
        let model;

        const library = {
            'bottle': "Стеклянный прах в песках седых времен,\nЗабытый кубок, что испит до дна.\nТы не сосуд — ты тихий, горький стон,\nИ в теле хладном пустота одна...",
            'cup': "Чаша разбита. Треснул гранит.\nПамять кочевника небо хранит.\nГлина вернется в сырую постель,\nМусор закрутит веков метель."
        };

        async function init() {
            model = await cocoSsd.load();
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => video.play();
        }

        async function analyze() {
            if (video.paused) video.play();
            poemBox.classList.remove('show');
            btn.innerText = "Сканирование...";

            const predictions = await model.detect(video);
            
            setTimeout(() => {
                if (predictions.length > 0) {
                    const obj = predictions[0].class;
                    if (obj === 'bottle') poemBox.innerText = library.bottle;
                    else if (obj === 'cup') poemBox.innerText = library.cup;
                    else poemBox.innerText = `Обнаружено: ${obj}.\n\nЧужое здесь, не вечное, земное.\nЗабытое, ненужное, немое.`;
                } else {
                    poemBox.innerText = "Степь пуста. Только ветер и вечность.";
                }
                poemBox.classList.add('show');
                btn.innerText = "Анализировать";
            }, 600);
        }

        btn.addEventListener('click', analyze);
        window.onload = init;
    </script>
</body>
</html>
